name: Artifact sanity
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Artifact structure and frozen SHA256
        run: python3 scripts/artifact/check_artifact.py
